<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamBro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Exam Bro</h1>
    <button id="theme">Dark Mode</button>
  </header>

  <main>
    <section>
      <h2>Settings</h2>
      <label for="apiKey">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="Paste your API key here">
      <button id="saveKey">Save Key</button>
      <p>Your key is stored only in your browser.</p>
    </section>

    <section>
      <h2>Your Notes</h2>
      <label for="notes">Paste your notes or type a topic</label>
      <textarea id="notes" rows="8" placeholder="Paste your class notes here..."></textarea>
      <p><span id="charCount">0</span> characters</p>

      <label for="style">Answer Style</label>
      <select id="style">
        <option value="eli10">Explain like I'm 10</option>
        <option value="exam">Exam-focused</option>
        <option value="detailed">Detailed</option>
      </select>

      <button id="generateBtn">Generate Study Material</button>
    </section>

    <section>
        <p id="loading" class="hidden">Generating your study material...</p>
        <p id="error" class="hidden"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
